<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Details&Summar</h1>
    <details>
        <summary>Click me</summary>
        <h2>Deteails</h2>
        <p>This is the content that will be show/hidden.</p>
        <div>
            <p>More information can be placed here.</p>
        </div>
    </details>
    <h1>Details</h1>
    <label for="beowser">Choose youe browser from the list:</label>
    <input list="browser" id="beowser" name="browser">
    <details id="browser">
        <option value="Chrome">
        <option value="Firefox">
        <option value="Safari">
        <option value="Edge">
    <option value="Opera">
    </details>
    <h1>Mark</h1>
    <p>This is a <mark>highlighted</mark>text.</p>
    <h1>Progress</h1>
    <progress value="70" max="100">70%</progress>
    <h1>Meter</h1>
    <meter value="2" min="0" max="10">2 out of 10</meter>
    <h1>Time</h1>
    <time datetime="2023-10-10">October 10, 2023</time>
</body>
</html>
